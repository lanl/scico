# Install and run mypy

name: mypy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  workflow_dispatch:

jobs:
  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install Python 3
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          pip install mypy
          # scico's own dependencies, without which the scico.flax_nnx check
          # below cannot resolve annotations and silently passes regardless
          pip install -r requirements.txt
      - name: Run mypy
        run: |
          mypy --follow-imports=skip --ignore-missing-imports  --exclude "(numpy|test)" scico/ scico/numpy/util.py
      # Check scico.flax_nnx with imports followed, so that annotations resolve
      # to real types rather than being erased to Any by --follow-imports=skip.
      # "silent" rather than "normal" analyses the imported modules but does not
      # report errors in them, which keeps this step scoped to scico.flax_nnx
      # while the rest of the package still has pre-existing errors.
      - name: Run mypy on scico.flax_nnx with imports followed
        run: |
          mypy --follow-imports=silent --ignore-missing-imports scico/flax_nnx/
