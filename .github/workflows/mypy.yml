# Install and run mypy

name: mypy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  workflow_dispatch:

jobs:
  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install Python 3
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install dependencies
        # The package requirements are installed so that mypy can resolve the
        # types of the third-party packages. Without them, mypy cannot find
        # those packages, and the ignore_missing_imports setting reduces
        # everything imported from them to Any, which silently disables most
        # of the checking.
        run: |
          pip install mypy
          pip install -r requirements.txt
      - name: Run mypy
        run: |
          mypy
